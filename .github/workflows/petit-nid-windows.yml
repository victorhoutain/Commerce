name: Petit Nid - Windows EXE

on:
  push:
    branches:
      - petit-nid-windows-build
    paths:
      - '.github/workflows/petit-nid-windows.yml'
      - 'petit-nid-source.tar.xz.b64'
      - 'fix_runtime.py'
      - 'Lancer_et_Diagnostiquer.bat'
      - 'LIRE_AVANT.txt'
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Recuperer Petit Nid
        uses: actions/checkout@v4
      - name: Reconstruire le projet et verifier le paquet
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p game
          base64 --decode petit-nid-source.tar.xz.b64 | tar -xJ -C game
          python3 fix_runtime.py
          test -s game/scripts/world.gd
          test -s game/data/balance.json
          test -s game/project.godot
          echo "Contenu du jeu :"
          find game -maxdepth 3 -type f | sort
      - name: Installer Godot 4.5.2 officiel et les modeles Windows
        shell: bash
        run: |
          set -euo pipefail
          VERSION=4.5.2
          BASE="https://github.com/godotengine/godot-builds/releases/download/${VERSION}-stable"
          curl -fL --retry 3 -o /tmp/godot-linux.zip "${BASE}/Godot_v${VERSION}-stable_linux.x86_64.zip"
          curl -fL --retry 3 -o /tmp/godot-templates.tpz "${BASE}/Godot_v${VERSION}-stable_export_templates.tpz"
          mkdir -p /tmp/godot
          unzip -q /tmp/godot-linux.zip -d /tmp/godot
          GODOT_BIN=$(find /tmp/godot -type f -name 'Godot_v*-stable_linux.x86_64' -print -quit)
          test -n "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          sudo cp "$GODOT_BIN" /usr/local/bin/godot
          mkdir -p /tmp/godot-templates
          unzip -q /tmp/godot-templates.tpz -d /tmp/godot-templates
          mkdir -p "$HOME/.local/share/godot/export_templates/${VERSION}.stable"
          cp -a /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/${VERSION}.stable/"
          godot --version
      - name: Tester l'equilibrage
        working-directory: game
        run: python3 tests/test_balance.py
      - name: Importer le projet Godot et verifier les scripts
        working-directory: game
        run: godot --headless --path . --editor --import --quit
      - name: Tester les mecanismes et verifier l'absence d'erreurs Godot
        working-directory: game
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script res://tests/smoke_test.gd 2>&1 | tee /tmp/petit-nid-test.log
          grep -q 'PETIT NID : tests de gameplay OK' /tmp/petit-nid-test.log
          if grep -Eq '(SCRIPT ERROR:|^ERROR:)' /tmp/petit-nid-test.log; then
            echo "Erreur Godot detectee"
            exit 1
          fi
      - name: Tester l'ouverture avec moteur de rendu
        working-directory: game
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri >/dev/null
          xvfb-run -a godot --path . --quit-after 90 --rendering-driver opengl3 --log-file /tmp/petit-nid-graphique.log 2>&1 | tee /tmp/petit-nid-graphique-stdout.log
          if grep -Eq '(SCRIPT ERROR:|^ERROR:)' /tmp/petit-nid-graphique.log /tmp/petit-nid-graphique-stdout.log; then
            echo "Erreur du demarrage graphique Godot"
            exit 1
          fi
      - name: Construire Petit_Nid.exe Windows 64 bits
        working-directory: game
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          godot --headless --path . --export-release "Windows Desktop" "build/Petit_Nid.exe"
          test -s build/Petit_Nid.exe
          file build/Petit_Nid.exe
          sha256sum build/Petit_Nid.exe > build/Petit_Nid.exe.sha256
          cp ../Lancer_et_Diagnostiquer.bat build/Lancer_et_Diagnostiquer.bat
          cp ../LIRE_AVANT.txt build/LIRE_AVANT.txt
      - name: Publier le jeu Windows
        uses: actions/upload-artifact@v4
        with:
          name: Petit-Nid-Windows-64-bits
          path: |
            game/build/Petit_Nid.exe
            game/build/Petit_Nid.exe.sha256
            game/build/Lancer_et_Diagnostiquer.bat
            game/build/LIRE_AVANT.txt
          if-no-files-found: error
          retention-days: 30

  tester-exe-windows:
    needs: build-windows
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Telecharger l'executable genere
        uses: actions/download-artifact@v4
        with:
          name: Petit-Nid-Windows-64-bits
      - name: Demarrer le vrai programme Windows en mode test
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & ".\Petit_Nid.exe" --headless --quit-after 120 --verbose --log-file "$pwd\godot-test.log" 2>&1 | Out-String | Write-Host
          $exit = $LASTEXITCODE
          if (Test-Path "godot-test.log") {
            $log = Get-Content "godot-test.log" -Raw
            Write-Host $log
            if ($log -match '(SCRIPT ERROR:|(?m)^ERROR:)') { throw "Erreur du demarrage sous Windows" }
          } else {
            Write-Host "Pas de log Godot, verifier le code retour."
          }
          if ($exit -ne 0) { throw "Petit Nid.exe s'est ferme en erreur : $exit" }
          Write-Host "Petit Nid Windows : test de lancement OK"
